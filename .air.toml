root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
bin = "./tmp/main"
full_bin = "AI_ENDPOINT=http://localhost:11434/v1 AI_API_KEY=dummy AI_MODEL=llama3.2 ./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "frontend", "e2e"]
include_dir = ["cmd/server"]
exclude_file = []
delay = 1000 # ms
stop_on_error = true
log = "air.log"

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
