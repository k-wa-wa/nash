name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-guardrails:
    name: Backend Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go Version
        run: go version

      - name: Create Dummy Frontend Dist
        run: mkdir -p cmd/server/dist && touch cmd/server/dist/.keep

      - name: Install GolangCI-Lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: GolangCI-Lint
        run: golangci-lint run --timeout=5m ./...

      - name: Test
        run: go test -v ./...

  frontend-guardrails:
    name: Frontend Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    needs: [backend-guardrails, frontend-guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install dependencies (E2E)
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Build Backend
        run: go build -o nash ./cmd/server

      - name: Start Mock SSH Server
        working-directory: ./e2e/ssh_server
        run: docker compose up -d --build

      - name: Run E2E Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:8080
          CI: true
        run: |
          # Start the app in the background
          ../nash -config ssh_server/ssh_config &
          PID=$!
          
          # Wait for app to be ready
          echo "Waiting for backend to be ready..."
          timeout=30
          counter=0
          until curl -s http://localhost:8080 > /dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Timeout waiting for backend"
              kill $PID
              exit 1
            fi
            printf '.'
            sleep 1
            counter=$((counter+1))
          done
          echo "Backend is ready!"
          
          # Run tests
          npm test
          
          # Cleanup
          kill $PID

  build-and-push:
    name: Build and Push Docker Image
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build info
        id: buildinfo
        run: |
          HEAD_SHA="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
            echo "VERSION=pr-${HEAD_SHA:0:7}-${MERGE_SHA:0:7}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${HEAD_SHA:0:7}" >> $GITHUB_OUTPUT
          fi

          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=raw,value={{ steps.buildinfo.outputs.VERSION }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TIME=${{ steps.buildinfo.outputs.BUILD_TIME }}
            COMMIT_HASH=${{ steps.buildinfo.outputs.VERSION }}
