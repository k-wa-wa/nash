name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-guardrails:
    name: Backend Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go Version
        run: go version

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

      - name: Test
        run: go test -v ./...

  frontend-guardrails:
    name: Frontend Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    needs: [backend-guardrails, frontend-guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install dependencies (E2E)
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Build Backend
        run: go build -o nash ./cmd/server

      - name: Start Mock SSH Server
        working-directory: ./e2e/ssh_server
        run: docker compose up -d --build

      - name: Run E2E Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:8080
          CI: true
        run: |
          # Start the app in the background
          ../../nash -config ssh_server/ssh_config &
          PID=$!
          
          # Wait for app to be ready (simple sleep or curl loop)
          sleep 5
          
          # Run tests
          npm test
          
          # Cleanup
          kill $PID
