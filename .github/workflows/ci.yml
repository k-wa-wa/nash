name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-guardrails:
    name: Backend Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go Version
        run: go version

      - name: Create Dummy Frontend Dist
        run: mkdir -p cmd/server/dist && touch cmd/server/dist/.keep

      - name: Install GolangCI-Lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: GolangCI-Lint
        run: golangci-lint run --timeout=5m ./...

      - name: Test
        run: go test -v ./...

  frontend-guardrails:
    name: Frontend Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium


      - name: Unit Tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e-tests:
    name: E2E Tests
    needs: [backend-guardrails, frontend-guardrails]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install dependencies (E2E)
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Build Backend
        run: go build -o nash ./cmd/server

      - name: Start Mock SSH Server
        working-directory: ./e2e/ssh_server
        run: docker compose up -d --build

      - name: Run E2E Tests
        working-directory: ./e2e
        env:
          BASE_URL: http://localhost:8080
          CI: true
        run: |
          # Start the app in the background
          ../../nash -config ssh_server/ssh_config &
          PID=$!
          
          # Wait for app to be ready
          echo "Waiting for backend to be ready..."
          timeout=30
          counter=0
          until curl -s http://localhost:8080 > /dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Timeout waiting for backend"
              kill $PID
              exit 1
            fi
            printf '.'
            sleep 1
            counter=$((counter+1))
          done
          echo "Backend is ready!"
          
          # Run tests
          npm test
          
          # Cleanup
          kill $PID
