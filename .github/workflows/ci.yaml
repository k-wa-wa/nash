name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          go mod download
          cd frontend && npm install
          cd ../e2e && npm install

      - name: Install Playwright Browsers
        run: cd e2e && npx playwright install --with-deps

      - name: Mock Up SSH Server
        run: make mock-up

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Unit Test
        run: make test

      - name: Start Backend
        run: |
          ./nash -config e2e/ssh_server/ssh_config &
          echo "Backend started"
          sleep 5

      - name: E2E Test
        run: cd e2e && npm test
        env:
          BASE_URL: http://localhost:8080
          CI: true

      - name: Mock Down
        if: always()
        run: make mock-down
